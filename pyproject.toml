[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "silentabi"
version = "0.1.0"
description = "Compile-clean C struct changes that silently break ABI: model, diff, and gcc-verified padding/wire audit"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
keywords = ["abi", "c", "struct", "padding", "ctypes", "wire-format"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Debuggers",
]

[project.scripts]
silentabi = "silentabi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
